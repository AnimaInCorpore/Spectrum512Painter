name: Deploy to Website

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry Run (simulate upload)'
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history, so the timestamp step below can find each file's last commit.
          fetch-depth: 0

      - name: Install deploy tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      # git does not record mtimes, so a fresh checkout stamps every file with the time of
      # the run. `mirror` compares size and mtime, so without this every deploy re-uploads
      # the entire site. Setting each file's mtime to the date of the commit that last
      # touched it makes those timestamps stable between runs, so only genuinely changed
      # files transfer. `--ignore-time` would also stop the churn, but it compares size
      # alone and would silently skip an edit that happens to preserve a file's length.
      # Must run before the metadata is stripped, since it reads .git. Done inline rather
      # than with the git-restore-mtime package: that version drives `git whatchanged`,
      # which git 2.55 refuses to run, and it reports the failure only as a per-file
      # warning while still exiting 0 - so it silently sets no timestamps at all.
      - name: Restore file timestamps from git history
        run: |
          restored=0
          while IFS= read -r -d '' file; do
            stamp=$(git log -1 --format=%cI -- "$file")
            if [ -n "$stamp" ] && [ -f "$file" ]; then
              touch -d "$stamp" "$file"
              restored=$((restored + 1))
            fi
          done < <(git ls-files -z)
          echo "restored mtimes on $restored files"

      # The mirror step below uploads the whole workspace, so anything that must not be
      # published has to be gone before it runs. Deleting these rather than adding an
      # --exclude is deliberate: lftp skips excluded paths entirely, so an exclude would
      # leave the already-published .git directory sitting on the server, whereas removing
      # it here lets `mirror --delete` clean it up on the next run.
      - name: Strip repository metadata from the upload
        run: rm -rf .git .github .gitignore .gitmodules

      # If you have a build process (e.g., minification), uncomment and configure these lines:
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - name: Install and Build
      #   run: |
      #     npm install
      #     npm run build

      - name: FTP/SFTP Deploy
        shell: bash
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['dry-run'] || 'false' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          DRY_ARG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_ARG="--dry-run"
          fi

          LFTP_CMD="
            set cmd:fail-exit yes;
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 15;
            set sftp:auto-confirm yes;
            open -u $FTP_USERNAME,$FTP_PASSWORD -p 23 sftp://$FTP_SERVER;
            mirror --reverse --delete --verbose \
              --exclude node_modules/ \
              --exclude-glob *.rom \
              --exclude-glob *.ROM \
              --exclude eslint.config.cjs \
              --exclude package.json \
              --exclude package-lock.json \
              $DRY_ARG \
              ./ /web/anides.de/painter/;
          "
          timeout 840s lftp -c "$LFTP_CMD"
